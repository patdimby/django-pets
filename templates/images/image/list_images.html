{% load thumbnail %}
{% for image in images %}
<div class="image">
  <a href="{{ image.get_absolute_url }}">
    {% if image.image %}{% thumbnail image.image 300x300 crop="smart" as im %}<img src="{{ im.url }}" alt="{{ image.title }}">{% endif %}
    {{ image.title }}
  </a>
</div>
{% empty %}<p>No bookmarked images yet.</p>{% endfor %}
